<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Sigil Grid">
  <defs>
    <radialGradient id="tile" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1c2a44" />
      <stop offset="100%" stop-color="#0d1524" />
    </radialGradient>
    <linearGradient id="claimed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8d7b8" />
      <stop offset="55%" stop-color="#c4a15a" />
      <stop offset="100%" stop-color="#8a6a32" />
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="62" height="62" rx="14" fill="url(#tile)" stroke="#c4a15a" stroke-width="2" />

  <!-- Three unclaimed cells, then the claimed one with its arrows. -->
  <g fill="#e8d7b8" fill-opacity="0.07" stroke="#c4a15a" stroke-opacity="0.45" stroke-width="1.6">
    <rect x="35" y="9" width="20" height="20" rx="3" />
    <rect x="9" y="35" width="20" height="20" rx="3" />
    <rect x="35" y="35" width="20" height="20" rx="3" />
  </g>

  <rect x="9" y="9" width="20" height="20" rx="3" fill="url(#claimed)" stroke="#e8d7b8" stroke-width="1.6" />
  <circle cx="19" cy="19" r="3.4" fill="#0d1524" fill-opacity="0.85" />

  <g fill="#c4a15a">
    <path d="M30.5 14.5 L34.5 19 L30.5 23.5 Z" />
    <path d="M14.5 30.5 L19 34.5 L23.5 30.5 Z" />
  </g>
</svg>
